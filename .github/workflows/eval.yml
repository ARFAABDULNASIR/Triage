name: Extraction eval

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          echo "DJANGO_SECRET_KEY=ci-test-key" >> ../.env
          echo "USE_SQLITE=True" >> ../.env
          echo "CELERY_TASK_ALWAYS_EAGER=True" >> ../.env
          echo "CREDENTIALS_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> ../.env
      - run: python manage.py migrate --noinput
      - run: python manage.py run_extraction_eval
